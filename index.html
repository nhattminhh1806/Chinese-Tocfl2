<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thẻ từ vựng TOCFL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDEFE9; --card:#FCFCFA; --ink:#1E241F; --soft:#6C756B;
  --rule:#D6DACF; --jade:#2E6B5E; --jade-tint:#DEE9E4;
  --seal:#B0433F; --seal-tint:#F4DEDC; --grid:#D6B4B2;
  --zh:"Noto Serif TC","Songti TC","PingFang TC","Microsoft JhengHei",serif;
  --vi:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);font-family:var(--vi);
  display:flex;flex-direction:column;overflow:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button,select{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px}

/* ---------- header ---------- */
.top{padding:12px 16px 8px;border-bottom:1px solid var(--rule);flex:none}
.top-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.brand{font-family:var(--zh);font-size:19px;font-weight:700;letter-spacing:.06em}
.brand small{font-family:var(--vi);font-size:10.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);display:block;margin-top:2px;letter-spacing:.14em}
.score{font-size:12px;color:var(--soft);white-space:nowrap;text-align:right}
.score b{color:var(--jade);font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:3px;background:var(--rule);border-radius:2px;margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--jade);transition:width .3s ease}

/* ---------- controls ---------- */
.ctrl{padding:10px 16px;display:flex;flex-direction:column;gap:8px;flex:none}
.row{display:flex;gap:8px}
select{
  flex:1;min-width:0;appearance:none;background:var(--card);border:1px solid var(--rule);
  border-radius:9px;padding:9px 26px 9px 11px;font-size:13.5px;font-weight:500;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='7'><path d='M1 1l4 4 4-4' fill='none' stroke='%236C756B' stroke-width='1.5'/></svg>");
  background-repeat:no-repeat;background-position:right 10px center;
}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  border:1px solid var(--rule);background:transparent;border-radius:20px;
  padding:6px 12px;font-size:12.5px;font-weight:500;cursor:pointer;transition:.15s
}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

/* ---------- stage / card ---------- */
.stage{flex:1;min-height:0;padding:6px 16px 0;display:flex;flex-direction:column;align-items:center}
.count{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);font-variant-numeric:tabular-nums;margin-bottom:6px}
.card{position:relative;width:100%;max-width:480px;flex:1;min-height:0;perspective:1400px;cursor:pointer}
.flipper{position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.2,.7,.3,1);transform-style:preserve-3d}
.card.flipped .flipper{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--card);border:1px solid var(--rule);border-radius:16px;
  box-shadow:0 1px 0 rgba(30,36,31,.04),0 12px 28px -22px rgba(30,36,31,.5);
  display:flex;padding:18px;text-align:center;
  overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch
}
/* margin:auto để căn giữa mà vẫn cuộn được khi nội dung cao hơn thẻ */
.fc{margin:auto;display:flex;flex-direction:column;align-items:center;width:100%;padding:26px 0 8px}
.fc>*{flex:0 0 auto;max-width:100%}
.face.back{transform:rotateY(180deg)}
.seal{
  position:absolute;top:12px;left:12px;width:30px;height:30px;border-radius:5px;
  background:var(--seal);color:#fff;font-family:var(--zh);font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;line-height:1.1;letter-spacing:.02em
}
.topic{position:absolute;top:17px;right:14px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);max-width:52%;text-align:right}
.hint{margin-top:20px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}

/* signature: 米字格 practice grid */
.gridbox{position:relative;width:min(58vw,220px);aspect-ratio:1;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.gridbox.compact{width:min(40vw,148px)}
.gridbox.compact .hanzi{font-size:clamp(34px,11vw,72px)}
.gridbox.compact .hanzi.two{font-size:clamp(24px,7.5vw,44px)}
.gridbox.compact .hanzi.many{font-size:clamp(17px,5vw,28px)}
.gridbox svg{position:absolute;inset:0;width:100%;height:100%}
.hanzi{font-family:var(--zh);font-weight:500;line-height:1;position:relative;z-index:1}
.gridbox .hanzi{font-size:clamp(52px,17vw,116px)}
.hanzi.two{font-size:clamp(34px,11vw,68px)}
.hanzi.many{font-size:clamp(24px,7.5vw,44px);line-height:1.25;padding:0 6px}

.pinyin{
  font-family:var(--zh);font-size:clamp(19px,5.4vw,25px);color:var(--jade);margin-top:12px;
  letter-spacing:.01em;line-height:1.3;background:none;border:0;padding:0;cursor:pointer
}
.pinyin .ic{font-size:.62em;opacity:.65;margin-left:5px}
.ex{
  margin-top:18px;padding-top:14px;border-top:1px dashed var(--rule);
  width:100%;max-width:30ch;text-align:left;cursor:pointer
}
.ex-label{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);margin-bottom:7px}
.ex-zh{font-family:var(--zh);font-size:clamp(15px,4.2vw,17.5px);line-height:1.7;margin:0}
.ex-zh b{color:var(--seal);font-weight:700}
.ex-py{font-family:var(--zh);font-size:12.5px;line-height:1.5;color:var(--jade);margin:5px 0 0}
.ex-vi{font-size:12.5px;color:var(--soft);line-height:1.5;margin:5px 0 0}
.hv{font-size:12.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--seal);margin-top:12px;font-weight:600;line-height:1.4}
.mean{font-size:clamp(18px,5.2vw,24px);font-weight:500;line-height:1.35;margin-top:6px;max-width:22ch}
.pos{margin-top:12px;font-size:11.5px;color:var(--soft);border:1px solid var(--rule);border-radius:20px;padding:4px 11px}
.small-zh{font-family:var(--zh);font-size:clamp(30px,9vw,44px);font-weight:500;line-height:1.25}
.small-zh.long{font-size:clamp(20px,6vw,30px)}
.prompt{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin-bottom:12px}
.spk{
  margin-top:12px;border:1px solid var(--rule);background:transparent;border-radius:20px;
  padding:6px 14px;font-size:12.5px;cursor:pointer;color:var(--soft)
}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:12px}
.empty p{margin:0;font-size:15px;line-height:1.5;max-width:26ch}
.empty .zh{font-family:var(--zh);font-size:40px;color:var(--rule)}

/* ---------- actions ---------- */
.acts{flex:none;padding:12px 16px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:9px;align-items:center}
.judge{display:flex;gap:10px;width:100%;max-width:480px}
.judge button{
  flex:1;padding:14px 8px;border-radius:12px;font-size:14.5px;font-weight:600;cursor:pointer;border:1px solid;transition:.15s
}
.no{background:var(--seal-tint);border-color:#E9C7C4;color:var(--seal)}
.yes{background:var(--jade-tint);border-color:#C4DAD2;color:var(--jade)}
.judge button:active{transform:translateY(1px)}
.mini{display:flex;gap:18px}
.mini button{background:none;border:0;font-size:12px;color:var(--soft);cursor:pointer;padding:4px 2px}
.mini button:disabled{opacity:.35}
@media (max-height:640px){
  .ctrl{padding:8px 16px;gap:6px}
  .gridbox{width:min(48vw,180px)}
  .top{padding:9px 16px 6px}
}
/* ---------- bảng sao lưu ---------- */
.sheet{
  position:fixed;inset:0;background:rgba(30,36,31,.45);z-index:20;
  display:flex;align-items:flex-end;justify-content:center;padding:0
}
.sheet[hidden]{display:none}
.sheet-box{
  background:var(--card);width:100%;max-width:480px;border-radius:16px 16px 0 0;
  padding:20px 18px calc(20px + env(safe-area-inset-bottom));
  max-height:88vh;overflow-y:auto;border:1px solid var(--rule)
}
.sheet-box h2{font-family:var(--zh);font-size:17px;margin:0 0 6px;font-weight:700}
.sheet-box .note{font-size:12.5px;line-height:1.55;color:var(--soft);margin:0 0 14px}
.sheet-box label{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin:14px 0 6px}
.sheet-box textarea{
  width:100%;border:1px solid var(--rule);border-radius:10px;padding:10px;font-size:12px;
  font-family:ui-monospace,Menlo,monospace;line-height:1.5;background:var(--paper);color:var(--ink);
  resize:none;word-break:break-all
}
.sheet-acts{display:flex;gap:8px;margin-top:14px}
.sheet-acts .chip{flex:1;padding:11px}
.sheet-box .chip{cursor:pointer}
@media (prefers-reduced-motion:reduce){
  .flipper{transition:none}
  .bar i{transition:none}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-row">
    <div class="brand">詞彙卡<small>Thẻ từ vựng TOCFL</small></div>
    <div class="score">Đã thuộc <b id="kn">0</b> / <span id="tot">0</span></div>
  </div>
  <div class="bar"><i id="barfill"></i></div>
</header>

<div class="ctrl">
  <div class="row">
    <select id="lv" aria-label="Cấp độ">
      <option value="all">Cả hai cấp (832)</option>
      <option value="1">Level 1 — 入門級 (347)</option>
      <option value="2">Level 2 — 基礎級 (485)</option>
    </select>
    <select id="ctx" aria-label="Chủ đề"></select>
  </div>
  <div class="chips">
    <button class="chip" id="dir" aria-pressed="false">漢 → Việt</button>
    <button class="chip" id="only" aria-pressed="false">Chỉ từ chưa thuộc</button>
    <button class="chip" id="shuf" aria-pressed="false">Xáo thẻ</button>
  </div>
</div>

<main class="stage">
  <div class="count" id="count">—</div>
  <div class="card" id="card">
    <div class="flipper">
      <div class="face front" id="front"></div>
      <div class="face back" id="back"></div>
    </div>
  </div>
</main>

<div class="acts">
  <div class="judge">
    <button class="no" id="btnNo">Chưa thuộc</button>
    <button class="yes" id="btnYes">Đã thuộc</button>
  </div>
  <div class="mini">
    <button id="btnBack">← Thẻ trước</button>
    <button id="btnSkip">Bỏ qua →</button>
    <button id="btnBackup">Sao lưu</button>
    <button id="btnReset">Xóa tiến độ</button>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-box">
    <h2>備份 Sao lưu tiến độ</h2>
    <p class="note">Safari không giữ được dữ liệu khi mở file trực tiếp từ máy. Chép mã dưới đây lưu vào Ghi chú; lần sau mở lại chỉ cần dán vào ô bên dưới để khôi phục.</p>
    <label>Mã hiện tại — <span id="cnt2">0</span> từ đã thuộc</label>
    <textarea id="outCode" rows="3" readonly></textarea>
    <button class="chip" id="btnCopy">Chép mã</button>
    <label>Khôi phục từ mã cũ</label>
    <textarea id="inCode" rows="3" placeholder="Dán mã sao lưu vào đây..."></textarea>
    <div class="sheet-acts">
      <button class="chip" id="btnRestore">Khôi phục</button>
      <button class="chip" id="btnClose">Đóng</button>
    </div>
  </div>
</div>

<script>

/* ---------- storage (bền qua các phiên, có bản dự phòng trong bộ nhớ) ---------- */
const mem = {};
const store = {
  async get(k){
    try{ const r = await window.storage.get(k); if(r) return JSON.parse(r.value); }catch(e){}
    try{ const v = localStorage.getItem(k); if(v) return JSON.parse(v); }catch(e){}   // khi mở bằng trình duyệt
    return k in mem ? mem[k] : null;
  },
  async set(k,v){
    mem[k]=v;
    try{ await window.storage.set(k, JSON.stringify(v)); }catch(e){}
    try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){}
  }
};

let known = {};            // {id:true}
let S = { lv:'all', ctx:'all', dir:'zh2vi', only:false, shuf:false };
let deck = [], pos = 0, flipped = false, hist = [];

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const speakable = w => w.split('/')[0].replace(/[()（）]/g,'');

/* ---------- deck ---------- */
function buildDeck(){
  deck = DATA.filter(d =>
    (S.lv==='all' || String(d.lv)===S.lv) &&
    (S.ctx==='all' || d.ctx===S.ctx) &&
    (!S.only || !known[d.i]));
  if(S.shuf) for(let i=deck.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [deck[i],deck[j]]=[deck[j],deck[i]]; }
  pos = 0; hist = []; flipped = false;
  render();
}

function sizeClass(w){ const n=[...w].length; return n<=1?'':(n<=2?'two':'many'); }

// in đậm từ đang học trong câu ví dụ (thử cả các biến thể sau dấu / và trong ngoặc)
function highlight(sent, w){
  const forms = new Set();
  w.split('/').forEach(v=>{
    v = v.trim();
    forms.add(v);
    forms.add(v.replace(/[()（）]/g,''));
    forms.add(v.replace(/[（(][^）)]*[）)]/g,''));
  });
  const list = [...forms].filter(Boolean).sort((a,b)=>b.length-a.length);
  for(const f of list){
    const i = sent.indexOf(f);
    if(i>=0) return esc(sent.slice(0,i))+'<b>'+esc(f)+'</b>'+esc(sent.slice(i+f.length));
  }
  return esc(sent);
}

      ${c.s?`<div class="pos">${esc(c.s)}</div>`:''}
      <div class="ex" data-say="${esc(c.e)}">
        <div class="ex-label">Ví dụ 🔊</div>
        <p class="ex-zh">${highlight(c.e,c.w)}</p>
        <p class="ex-py">${esc(c.ep)}</p>
        <p class="ex-vi">${esc(c.t)}</p>
      </div>`;
  const long = [...c.w].length > 4 ? ' long' : '';

  if(S.dir==='zh2vi'){
    return [ seal+wrap(grid(false)+`<div class="hint">Chạm để lật</div>`),
             seal+wrap(`<div class="small-zh${long}">${esc(c.w)}</div>`+details) ];
  }
  return [ seal+wrap(`<div class="prompt">Từ này tiếng Hoa là gì?</div><div class="mean">${esc(c.m)}</div><div class="hint">Chạm để lật</div>`),
           seal+wrap(grid(true)+details) ];
}

function render(){
  $('tot').textContent = DATA.length;
  const kc = Object.keys(known).length;
  $('kn').textContent = kc;
  $('barfill').style.width = (kc/DATA.length*100).toFixed(1)+'%';
  $('card').classList.toggle('flipped', flipped);

  if(!deck.length || pos>=deck.length){
    const done = deck.length && pos>=deck.length;
    $('count').textContent = done ? 'Hết bộ thẻ' : 'Trống';
    $('front').innerHTML = wrap(`<div class="empty"><div class="zh">${done?'完':'空'}</div>
      <p>${done ? 'Bạn đã lướt hết '+deck.length+' thẻ của bộ này.' : 'Không có thẻ nào khớp bộ lọc. Đổi chủ đề hoặc tắt “Chỉ từ chưa thuộc”.'}</p>
      ${done?'<button class="chip" id="again">Học lại bộ này</button>':''}</div>`);
    $('back').innerHTML = '';
    $('card').classList.remove('flipped');
    const a = $('again'); if(a) a.onclick = e => { e.stopPropagation(); buildDeck(); };
    return;
  }
  const c = deck[pos];
  $('count').textContent = `${pos+1} / ${deck.length}`;
  const [f,b] = faces(c);
  $('front').innerHTML = f; $('back').innerHTML = b;
}

/* ---------- điều hướng ---------- */
function advance(){
  if(flipped){ flipped=false; $('card').classList.remove('flipped'); setTimeout(()=>{pos++;render();},230); }
  else { pos++; render(); }
}
function mark(v){
  if(pos>=deck.length||!deck.length) return;
  const c = deck[pos];
  hist.push({pos, id:c.i, was:!!known[c.i]});
  if(v) known[c.i]=true; else delete known[c.i];
  save(); advance();
}
function goBack(){
  if(!hist.length) return;
  const h = hist.pop();
  if(h.was) known[h.id]=true; else delete known[h.id];
  pos = h.pos; flipped=false; save(); render();
}

let t=null;
function save(){
  clearTimeout(t);
  t=setTimeout(()=>{
    store.set('tocfl-known', known);
    store.set('tocfl-settings', S);
    // nhúng mã vào địa chỉ trang: nếu bạn đánh dấu trang (bookmark) hoặc
    // thêm vào màn hình chính, tiến độ đi theo địa chỉ đó
    try{ history.replaceState(null,'','#p='+exportCode()); }catch(e){}
  },250);
}

/* ---------- mã sao lưu: 1 bit cho mỗi từ, mã hoá base64 ---------- */
function exportCode(){
  const bytes = new Uint8Array(Math.ceil(DATA.length/8));
  DATA.forEach((d,ix)=>{ if(known[d.i]) bytes[ix>>3] |= 1<<(ix&7); });
  let s=''; bytes.forEach(b=>s+=String.fromCharCode(b));
  return btoa(s);
}
function importCode(code){
  const s = atob(String(code).trim().replace(/\s+/g,''));
  const next = {};
  DATA.forEach((d,ix)=>{ if((s.charCodeAt(ix>>3)>>(ix&7))&1) next[d.i]=true; });
  known = next;
}

function speak(text){
  if(!('speechSynthesis' in window)) return;
  try{
    const u = new SpeechSynthesisUtterance(text);
    u.lang='zh-TW'; u.rate=.8;
    const v = speechSynthesis.getVoices().find(x=>/zh[-_]?(TW|CN|HK)/i.test(x.lang));
    if(v) u.voice=v;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- sự kiện ---------- */
$('card').addEventListener('click', e=>{
  const s = e.target.closest('[data-say]');
  if(s){ e.stopPropagation(); speak(s.dataset.say); return; }
  if(!deck.length||pos>=deck.length) return;
  flipped=!flipped; $('card').classList.toggle('flipped',flipped);
});
$('btnYes').onclick = ()=>mark(true);
$('btnNo').onclick  = ()=>mark(false);
$('btnSkip').onclick= ()=>{ if(pos<deck.length){ hist.push({pos,id:deck[pos].i,was:!!known[deck[pos].i]}); advance(); } };
$('btnBack').onclick= goBack;
$('btnReset').onclick= ()=>{ if(confirm('Xóa toàn bộ tiến độ đã đánh dấu?')){ known={}; save(); buildDeck(); } };

$('btnBackup').onclick = ()=>{
  $('outCode').value = exportCode();
  $('cnt2').textContent = Object.keys(known).length;
  $('sheet').hidden = false;
};
$('btnClose').onclick = ()=>{ $('sheet').hidden = true; };
$('sheet').onclick = e=>{ if(e.target===$('sheet')) $('sheet').hidden = true; };
$('btnCopy').onclick = async ()=>{
  const ta = $('outCode'), b = $('btnCopy');
  ta.focus(); ta.setSelectionRange(0, ta.value.length);
  let ok = false;
  try{ await navigator.clipboard.writeText(ta.value); ok = true; }
  catch(e){ try{ ok = document.execCommand('copy'); }catch(_){} }
  b.textContent = ok ? 'Đã chép ✓' : 'Nhấn giữ vào ô để chép';
  setTimeout(()=>{ b.textContent = 'Chép mã'; }, 2000);
};
$('btnRestore').onclick = ()=>{
  try{
    importCode($('inCode').value);
    save(); buildDeck();
    $('sheet').hidden = true;
    alert('Đã khôi phục '+Object.keys(known).length+' từ đã thuộc.');
  }catch(e){ alert('Mã không hợp lệ. Hãy chép lại toàn bộ mã.'); }
};

$('lv').onchange = e=>{ S.lv=e.target.value; save(); buildDeck(); };
$('ctx').onchange= e=>{ S.ctx=e.target.value; save(); buildDeck(); };
$('dir').onclick = e=>{ S.dir = S.dir==='zh2vi'?'vi2zh':'zh2vi';
  e.target.textContent = S.dir==='zh2vi'?'漢 → Việt':'Việt → 漢';
  e.target.setAttribute('aria-pressed', S.dir==='vi2zh'); save(); flipped=false; render(); };
$('only').onclick= e=>{ S.only=!S.only; e.target.setAttribute('aria-pressed',S.only); save(); buildDeck(); };
$('shuf').onclick= e=>{ S.shuf=!S.shuf; e.target.setAttribute('aria-pressed',S.shuf); save(); buildDeck(); };

document.addEventListener('keydown', e=>{
  if(e.key===' '){ e.preventDefault(); $('card').click(); }
  else if(e.key==='ArrowRight'||e.key==='2') mark(true);
  else if(e.key==='ArrowDown'||e.key==='1') mark(false);
  else if(e.key==='ArrowLeft') goBack();
});

/* ---------- khởi động ---------- */
(async function init(){
  $('ctx').innerHTML = '<option value="all">Tất cả chủ đề</option>' +
    TOPICS.map(t=>`<option value="${esc(t)}">${esc(t)} (${DATA.filter(d=>d.ctx===t).length})</option>`).join('');
  const k = await store.get('tocfl-known');   if(k) known = k;
  // mã trong địa chỉ trang (#p=...) được ưu tiên — dùng khi Safari không lưu được
  const h = location.hash.match(/[#&]p=([A-Za-z0-9+/=]+)/);
  if(h){ try{ const cur = Object.keys(known).length; importCode(h[1]);
              if(Object.keys(known).length < cur){ known = k || {}; } }catch(e){} }
  const s = await store.get('tocfl-settings');if(s) S = Object.assign(S,s);
  $('lv').value=S.lv; $('ctx').value=S.ctx;
  $('dir').textContent = S.dir==='zh2vi'?'漢 → Việt':'Việt → 漢';
  $('dir').setAttribute('aria-pressed', S.dir==='vi2zh');
  $('only').setAttribute('aria-pressed',S.only);
  $('shuf').setAttribute('aria-pressed',S.shuf);
  if('speechSynthesis' in window) speechSynthesis.getVoices();
  buildDeck();
})();
</script>
</body>
</html>
